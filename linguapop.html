<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7a1a">
<meta name="description" content="Aprende inglés con lecciones gamificadas, repaso de errores y llamadas con Nova.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LinguaPop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>LinguaPop – Aprende inglés jugando</title>
<style>
:root{
  --bg:#fff8f0; --card:#ffffff; --ink:#2b2140; --muted:#8a7f9c; --line:#eadfd2;
  --brand:#ff7a1a; --brand-d:#d65f00; --ok:#22b573; --ok-d:#168a55; --ok-bg:#dcf8ea;
  --bad:#ef4565; --bad-d:#c22846; --bad-bg:#ffe1e7; --blue:#2f8cff; --blue-d:#1a63c4;
  --purple:#8b5cf6; --gold:#ffc83a; --gold-d:#d99a00; --shadow:0 8px 24px rgba(80,40,0,.10);
  --locked:#d9d2e3; --locked-d:#bdb3cc;
}
:root[data-theme="dark"]{
  --bg:#17122a; --card:#241c3d; --ink:#f4efff; --muted:#a79bc4; --line:#3a2f5c;
  --ok-bg:#12382b; --bad-bg:#40182a; --shadow:0 8px 24px rgba(0,0,0,.35);
  --locked:#3a3057; --locked-d:#2c2444;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);
  display:flex;justify-content:center;transition:background .3s}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input,textarea{font-family:inherit;color:var(--ink)}
#app{width:100%;max-width:520px;min-height:100%;position:relative;background:var(--bg)}
@media(min-width:560px){body{background:linear-gradient(135deg,#ffb36b,#c58bff)}#app{box-shadow:0 0 60px rgba(0,0,0,.25);min-height:100vh}}
.hidden{display:none!important}

/* top bar */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border-bottom:2px solid var(--line)}
.logo{font-weight:900;font-size:19px;color:var(--brand);letter-spacing:-.5px;margin-right:auto;display:flex;align-items:center;gap:6px}
.chip{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;padding:5px 9px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.pro{background:linear-gradient(135deg,#ffe27a,#ffb300);color:#6b4500;font-weight:900;font-size:10px;letter-spacing:.8px;padding:2px 6px;border-radius:8px;border:1px solid #d99a00;box-shadow:0 1px 0 #d99a00;display:inline-block;vertical-align:middle}
.iconbtn{background:var(--card);border:2px solid var(--line);border-radius:12px;width:36px;height:36px;font-size:17px}
#view{padding:14px 14px 100px}
#nav{position:fixed;bottom:0;width:100%;max-width:520px;display:flex;background:var(--card);border-top:2px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;padding:8px 0 7px;font-weight:800;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button span{font-size:23px;filter:grayscale(1);opacity:.7;transition:.2s}
#nav button.on{color:var(--brand)}#nav button.on span{filter:none;opacity:1;transform:translateY(-2px) scale(1.1)}

/* cards & buttons */
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{margin:6px 0 10px;font-size:22px}h3{margin:0 0 6px}
.muted{color:var(--muted);font-size:13px}
.btn{display:block;width:100%;padding:14px;border-radius:16px;font-weight:900;font-size:16px;letter-spacing:.6px;text-transform:uppercase;color:#fff;background:var(--brand);box-shadow:0 5px 0 var(--brand-d);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-d)}
.btn.green{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}.btn.green:active{box-shadow:0 1px 0 var(--ok-d)}
.btn.red{background:var(--bad);box-shadow:0 5px 0 var(--bad-d)}.btn.red:active{box-shadow:0 1px 0 var(--bad-d)}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}.btn.blue:active{box-shadow:0 1px 0 var(--blue-d)}
.btn.ghost{background:var(--card);color:var(--brand);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn[disabled]{background:var(--locked);box-shadow:0 5px 0 var(--locked-d);color:var(--muted);cursor:not-allowed}
.btn.sm{display:inline-block;width:auto;padding:9px 16px;font-size:13px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}

/* goal */
.goal{display:flex;align-items:center;gap:12px}
.bar{height:14px;background:var(--line);border-radius:10px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,var(--brand));border-radius:10px;transition:width .5s}

/* path */
.unit{margin-bottom:6px}
.banner{border-radius:20px;padding:14px 16px;color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.banner b{font-size:12px;opacity:.85;letter-spacing:1px}
.banner h3{font-size:21px;margin:2px 0 0}
.banner .skip{margin-left:auto;background:rgba(255,255,255,.22);color:#fff;font-weight:900;font-size:12px;padding:8px 10px;border-radius:12px;border:2px solid rgba(255,255,255,.5)}
.path{display:flex;flex-direction:column;align-items:center;padding:14px 0 20px}
.node{width:76px;height:76px;border-radius:50%;margin:11px 0;font-size:32px;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s;border:0}
.node:active{transform:translateY(4px)!important}
.node.locked{background:var(--locked)!important;box-shadow:0 7px 0 var(--locked-d)!important;color:var(--muted);filter:none}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--ring);animation:pulse 1.5s infinite}
.node.cur::before{content:"EMPEZAR";position:absolute;top:-34px;background:var(--card);color:var(--ink);font-size:11px;font-weight:900;padding:5px 9px;border-radius:10px;border:2px solid var(--line);animation:bob 1.4s infinite;white-space:nowrap}
.node .star{position:absolute;bottom:-2px;right:-2px;font-size:17px;background:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.novacall{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;border-radius:20px;padding:12px;margin-bottom:14px;box-shadow:0 5px 0 #5b21b6;width:100%;text-align:left}
.novacall.locked{background:var(--locked);box-shadow:0 5px 0 var(--locked-d);color:var(--muted)}
.novacall .av{width:54px;height:54px;border-radius:50%;background:#2e1065;overflow:hidden;flex:none}
.ad{border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px}

@keyframes pulse{0%{transform:scale(.95);opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view-in{animation:fade .35s}

/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;max-width:520px;margin:0 auto}
.overlay.show{display:flex;animation:fade .25s}
.lh{display:flex;align-items:center;gap:10px;padding:14px}
.lh .x{background:none;font-size:24px;color:var(--muted);font-weight:900;padding:0 4px}
.lh .bar{flex:1;height:16px}
.lbody{flex:1;overflow:auto;padding:6px 18px 20px;display:flex;flex-direction:column}
.fox-line{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.fox-line .fx{width:74px;flex:none}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:9px 12px;font-weight:700;font-size:14px;position:relative}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:var(--line);border-left:0}
.q{font-size:22px;font-weight:900;margin:6px 0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 8px;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 var(--line);transition:.12s}
.opt .em{font-size:40px}
.opt.sel{border-color:var(--blue);background:rgba(47,140,255,.12);box-shadow:0 4px 0 var(--blue)}
.opt.good{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad);animation:shake .4s}
.ansarea{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:16px;background:repeating-linear-gradient(transparent 0 55px,var(--line) 55px 57px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;font-size:17px;box-shadow:0 3px 0 var(--line);animation:pop .2s}
.tok.used{background:var(--line);color:transparent;box-shadow:none;pointer-events:none}
.field{width:100%;border:2px solid var(--line);border-radius:16px;padding:14px;font-size:18px;background:var(--card);resize:none;outline:none;min-height:96px}
.field:focus{border-color:var(--blue)}
.speakers{display:flex;justify-content:center;gap:16px;margin:12px 0 20px}
.spk{width:92px;height:92px;border-radius:24px;font-size:38px;background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d);display:flex;align-items:center;justify-content:center}
.spk.slow{background:#38bdf8;box-shadow:0 6px 0 #0c8ac4;width:70px;height:70px;font-size:28px;align-self:flex-end}
.spk:active{transform:translateY(5px);box-shadow:none}
.mic{width:110px;height:110px;border-radius:50%;font-size:46px;background:var(--brand);color:#fff;box-shadow:0 7px 0 var(--brand-d);margin:10px auto;display:flex;align-items:center;justify-content:center}
.mic.rec{background:var(--bad);box-shadow:0 7px 0 var(--bad-d);animation:pulse2 1s infinite}
@keyframes pulse2{50%{transform:scale(1.07)}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols .opt{padding:14px 6px;font-size:16px;flex-direction:row;justify-content:center;text-align:center}
.opt.gone{visibility:hidden}
.lfoot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:2px solid var(--line);position:relative;transition:background .25s}
.lfoot.good{background:var(--ok-bg);border-color:var(--ok)}.lfoot.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb{display:none;margin-bottom:10px;animation:slideup .3s}
.lfoot.good .fb,.lfoot.bad .fb{display:block}
.fb b{font-size:19px;display:block;margin-bottom:2px}
.lfoot.good .fb b{color:var(--ok-d)}.lfoot.bad .fb b{color:var(--bad-d)}
.fb div{font-size:14px;font-weight:700}
.fb .tip{margin-top:4px;font-weight:600;opacity:.85}
.timer{font-weight:900;color:var(--bad);min-width:46px;text-align:right}
.result{align-items:center;text-align:center;justify-content:center;gap:10px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:14px 0}
.st{border-radius:16px;border:2px solid;padding:10px 4px;font-weight:900}
.st small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding-bottom:4px}
.st div{background:var(--card);border-radius:10px;padding:10px 0;font-size:22px}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:90;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* fox */
.fox{width:100%;height:auto;overflow:visible}
.fox .blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.fox.happy{animation:hop .6s}
.fox.sad{animation:droop .8s forwards}
.fox.celebrate{animation:jump .7s infinite}
.fox .tail{transform-origin:150px 150px;animation:wag 2.4s infinite ease-in-out}
@keyframes wag{50%{transform:rotate(8deg)}}
@keyframes hop{40%{transform:translateY(-14px) rotate(-4deg)}}
@keyframes droop{to{transform:translateY(6px) scale(.97)}}
@keyframes jump{50%{transform:translateY(-16px) rotate(4deg)}}

/* league / profile */
.lrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;font-weight:800}
.lrow.me{background:rgba(255,122,26,.16);border:2px solid var(--brand)}
.lrow .rk{width:26px;text-align:center;color:var(--muted)}
.lrow .av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--line)}
.zone{font-size:11px;font-weight:900;letter-spacing:1px;text-align:center;padding:4px;color:var(--muted)}
.zone.up{color:var(--ok-d)}.zone.down{color:var(--bad-d)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px}
.stat b{font-size:22px;display:block}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ach .ic{font-size:30px;width:44px;text-align:center}.ach.off{opacity:.4;filter:grayscale(1)}
.sw{position:relative;width:52px;height:30px;border-radius:20px;background:var(--locked);flex:none;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:25px}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-weight:800;border-bottom:1px solid var(--line)}
.pcard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 0 var(--line)}
.pcard .em{font-size:32px}.pcard small{display:block;color:var(--muted);font-weight:600;margin-top:2px}
.pcard:active{transform:translateY(3px);box-shadow:none}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:80;background:rgba(20,10,40,.55);display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:slideup .3s;max-height:88vh;overflow:auto}
#modal .sheet .btn{margin-top:10px}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-120px);z-index:100;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;font-weight:800;transition:.4s;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
.chest{font-size:80px;display:inline-block;animation:bob 1s infinite}
.pill{display:inline-block;padding:4px 10px;border-radius:12px;background:var(--line);font-weight:800;font-size:13px;margin:3px}
.pill.sel{background:var(--brand);color:#fff}

/* ===== Nova call ===== */
.call{background:radial-gradient(circle at 50% 30%,#4c1d95 0%,#1e1042 55%,#0b0620 100%);color:#fff;z-index:60;overflow:hidden}
.call .room{position:absolute;inset:0;pointer-events:none}
.call .room i{position:absolute;border-radius:50%;background:rgba(255,255,255,.07);filter:blur(1px)}
.ctop{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:14px 16px;text-shadow:0 1px 4px #000}
.ctop .nm{font-weight:900;font-size:17px}.ctop .tm{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:12px}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#ff4d4d;animation:pulse2 1s infinite}
.nova-wrap{position:absolute;left:0;right:0;top:48px;bottom:200px;display:flex;justify-content:center;align-items:flex-end;z-index:1}
.nova-wrap svg{height:100%;width:auto;max-width:100%}
.pip{position:absolute;right:12px;top:62px;width:84px;height:110px;border-radius:16px;background:linear-gradient(#ffd9b0,#ff9f5a);border:2px solid rgba(255,255,255,.7);z-index:4;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:11px;font-weight:800;color:#5a2d00;padding-bottom:4px}
.pip .fox{width:66px}
.subs{position:absolute;left:14px;right:14px;bottom:176px;z-index:5;text-align:center;font-weight:800;font-size:17px;line-height:1.35;text-shadow:0 2px 6px #000}
.subs span{background:rgba(0,0,0,.62);padding:5px 10px;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.subs .me{color:#9be7ff;display:block;margin-top:6px;font-size:15px}
.hintbox{position:absolute;left:14px;right:14px;bottom:128px;z-index:6;background:#fff3c4;color:#5a4300;border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;text-align:center;animation:pop .3s}
.cctl{position:absolute;bottom:0;left:0;right:0;z-index:7;padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.65) 40%)}
.cbtns{display:flex;justify-content:center;gap:18px;align-items:center}
.cb{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:24px;border:2px solid rgba(255,255,255,.3);backdrop-filter:blur(6px)}
.cb.on{background:#fff;color:#2e1065}
.cb.listening{background:#22c55e;border-color:#bbf7d0;animation:pulse2 1s infinite}
.cb.hang{width:70px;height:70px;background:#ef2b4a;font-size:30px;border:0;box-shadow:0 5px 0 #a3132c}
.ctext{display:flex;gap:8px}
.ctext input{flex:1;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;padding:11px 12px;font-size:16px;outline:none}
.ctext input::placeholder{color:rgba(255,255,255,.6)}
.ctext button{background:var(--brand);color:#fff;font-weight:900;border-radius:14px;padding:0 16px}
.chatlog{position:absolute;left:12px;right:12px;top:120px;bottom:190px;overflow:auto;z-index:5;display:flex;flex-direction:column;gap:8px;padding:8px}
.msg{max-width:82%;padding:9px 12px;border-radius:16px;font-weight:700;font-size:15px}
.msg.n{background:rgba(255,255,255,.92);color:#2e1065;align-self:flex-start;border-bottom-left-radius:4px}
.msg.u{background:var(--brand);align-self:flex-end;border-bottom-right-radius:4px}
.ringing{position:absolute;inset:0;z-index:9;background:rgba(15,5,40,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:900;font-size:20px}
.ringing .ava{width:130px;height:130px;border-radius:50%;overflow:hidden;background:#2e1065;border:4px solid #c084fc;animation:pulse2 1.2s infinite}

/* Nova svg */
.nova .mouth{display:none}
.nova[data-expr="neutral"] .m-neutral,.nova[data-expr="think"] .m-neutral{display:block}
.nova[data-expr="smirk"] .m-smirk{display:block}
.nova[data-expr="happy"] .m-smile{display:block}
.nova[data-expr="surprised"] .m-open{display:block}
.nova.talk .mouth{display:none}
.nova.talk .m-talk{display:block;transform-box:fill-box;transform-origin:center;animation:talk .22s infinite alternate ease-in-out}
@keyframes talk{from{transform:scaleY(.25) scaleX(.85)}to{transform:scaleY(1.1) scaleX(1.05)}}
.nova .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.nova .brow{transition:transform .35s;transform-box:fill-box;transform-origin:center}
.nova[data-expr="smirk"] .br{transform:translateY(-5px) rotate(-8deg)}
.nova[data-expr="smirk"] .bl{transform:translateY(1px) rotate(4deg)}
.nova[data-expr="happy"] .brow{transform:translateY(-3px)}
.nova[data-expr="surprised"] .brow{transform:translateY(-9px)}
.nova[data-expr="think"] .br{transform:translateY(-8px) rotate(-10deg)}
.nova[data-expr="think"] .pupil{transform:translate(5px,-3px)}
.nova[data-expr="surprised"] .pupil{transform:scale(.8)}
.nova .pupil{transition:transform .3s;transform-box:fill-box;transform-origin:center}

/* ----------------------- Progreso, XP, racha, logros ----------------------- */
function curStreak() {
  if (!ST.lastDay) return 0;
  const gap = daysBetween(ST.lastDay, dayKey());
  if (gap <= 1) return ST.streak;
  if (gap === 2 && ST.pro && ST.shield !== monthKey()) return ST.streak;
  return 0;
}
function touchStreak() {
  const t = dayKey(); if (ST.lastDay === t) return;
  if (!ST.lastDay) ST.streak = 1;
  else {
    const gap = daysBetween(ST.lastDay, t);
    if (gap === 1) ST.streak++;
    else if (gap === 2 && ST.pro && ST.shield !== monthKey()) { ST.shield = monthKey(); ST.streak++; toast('🛡️ Protector de racha usado: tu racha sigue viva'); }
    else ST.streak = 1;
  }
  ST.lastDay = t; ST.best = Math.max(ST.best, ST.streak);
}
function addXP(n) {
  const t = dayKey(), before = ST.xpHist[t] || 0;
  ST.xp += n; ST.xpHist[t] = before + n;
  if (before < ST.goal && before + n >= ST.goal) { ST.gems += 10; setTimeout(() => toast('🎯 ¡Meta diaria cumplida! +10 💎'), 600); }
}
function checkAch() {
  ACHIEVEMENTS.forEach(a => {
    if (!ST.ach[a.id] && a.t(ST)) { ST.ach[a.id] = Date.now(); ST.gems += 5; setTimeout(() => toast(`${a.ic} Logro: ${a.n} (+5 💎)`), 900); }
  });
}
function addError(id) {
  if (id.startsWith('w:')) { const w = id.slice(2); ST.words[w] = (ST.words[w] || 0) + 1; return; }
  if (!ST.errors.includes(id)) ST.errors.push(id);
  if (ST.errors.length > 200) ST.errors.shift();
  ST.weak[id] = (ST.weak[id] || 0) + 1;
}
function removeError(id) {
  if (id.startsWith('w:')) { delete ST.words[id.slice(2)]; return; }
  ST.errors = ST.errors.filter(e => e !== id);
}

function fl(msg) { return `<div class="fox-line"><div class="fx" id="fxbox">${fox('idle')}</div><div class="bubble" id="bub">${msg}</div></div>`; }
function setFox(mood, msg) { const f = $('#fxbox'); if (f) f.innerHTML = fox(mood); const b = $('#bub'); if (b && msg) b.textContent = msg; }
function setReady(v) { const c = $('#chk'); if (c) c.disabled = !v; }
function renderEx() {
  const ex = SES.list[SES.i];
  SES.cur = ex; SES.checked = false; SES.ans = null; SES.check = null; SES.skip = false;

const RENDER = {
  mc(ex) {
    const opts = shuffle(ex.opts.map((o, i) => ({ ...o, ok: i === ex.a })));
    const sayOpt = /Cómo se dice/.test(ex.q);
    $('#lbody').innerHTML = fl('Elige la traducción correcta') + `<div class="q">${esc(ex.q)}</div><div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="em">${o.e}</span>${esc(o.t)}</button>`).join('')}</div>`;
    const els = document.querySelectorAll('.opt');
    els.forEach(b => b.onclick = () => {
      if (SES.checked) return;
      els.forEach(x => x.classList.remove('sel')); b.classList.add('sel'); SES.ans = +b.dataset.i; setReady(true); SFX.click();
      if (sayOpt) speak(opts[SES.ans].t);
    });
    SES.check = () => {
      const ok = opts[SES.ans].ok;
      els.forEach((b, i) => { if (opts[i].ok) b.classList.add('good'); else if (i === SES.ans) b.classList.add('bad'); });
      return { ok, answer: opts.find(o => o.ok).t };
    };
  },
  order(ex) {
    const toks = shuffle([...ex.en.split(' '), ...ex.extra]).map((w, i) => ({ w, i }));
    let picked = [];
    $('#lbody').innerHTML = fl('Toca las palabras en orden') + `<div class="q">${esc(ex.es)}</div><div class="ansarea" id="ans"></div><div class="bank" id="bank"></div>`;
    const draw = () => {
      $('#ans').innerHTML = picked.map(t => `<button class="tok" data-i="${t.i}">${esc(t.w)}</button>`).join('');
      $('#bank').innerHTML = toks.map(t => `<button class="tok ${picked.includes(t) ? 'used' : ''}" data-i="${t.i}">${esc(t.w)}</button>`).join('');
      document.querySelectorAll('#ans .tok').forEach(b => b.onclick = () => { if (SES.checked) return; picked = picked.filter(t => t.i !== +b.dataset.i); SFX.click(); draw(); });
      document.querySelectorAll('#bank .tok').forEach(b => b.onclick = () => { if (SES.checked) return; picked.push(toks.find(t => t.i === +b.dataset.i)); SFX.click(); speak(b.textContent, 1.1); draw(); });
      setReady(picked.length > 0);
    };
    draw();
    SES.check = () => {
      const ok = normalize(picked.map(t => t.w).join(' ')) === normalize(ex.en);
      if (ok) speak(ex.en);
      return { ok, answer: ex.en };
    };
  },
  write(ex) {
    $('#lbody').innerHTML = fl('Escribe en inglés') + `<div class="q">${esc(ex.es)}</div><textarea class="field" id="inp" placeholder="Escribe aquí en inglés…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>`;
    const inp = $('#inp'); inp.focus();
    inp.oninput = () => setReady(inp.value.trim().length > 0);
    inp.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!$('#chk').disabled) onCheck(); } };
    SES.check = () => {
      inp.disabled = true;
      const u = normalize(inp.value), targets = [ex.en, ...ex.alt].map(normalize);
      if (targets.includes(u)) { speak(ex.en); return { ok: true, answer: ex.en }; }
      if (u.length > 5 && targets.some(t => lev(u, t) <= 1)) { speak(ex.en); return { ok: true, answer: ex.en, note: `Casi perfecto, cuida la ortografía: "${ex.en}"` }; }
      return { ok: false, answer: ex.en };
    };
  },
  match(ex) {
    const L = shuffle(ex.pairs.map(p => p[0])), R = shuffle(ex.pairs.map(p => p[1]));
    let sl = null, sr = null, matched = 0, mistakes = 0;
    $('#lbody').innerHTML = fl('Une cada palabra con su traducción') + `<div class="q">Empareja los pares</div><div class="cols"><div style="display:grid;gap:12px">${L.map(w => `<button class="opt" data-s="l" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div><div style="display:grid;gap:12px">${R.map(w => `<button class="opt" data-s="r" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div></div>`;
    const btns = [...document.querySelectorAll('.cols .opt')];
    const pairOk = (l, r) => ex.pairs.some(p => p[0] === l && p[1] === r);
    btns.forEach(b => b.onclick = () => {
      if (SES.checked || b.classList.contains('good')) return;
      const side = b.dataset.s, w = b.dataset.w;
      btns.filter(x => x.dataset.s === side && !x.classList.contains('good')).forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      if (side === 'l') sl = b; else { sr = b; speak(w, 1); }
      SFX.click();
      if (sl && sr) {
        const a = sl, c = sr; sl = sr = null;
        if (pairOk(a.dataset.w, c.dataset.w)) {
          [a, c].forEach(x => { x.classList.remove('sel'); x.classList.add('good'); });
          SFX.ok(); matched++;
          setTimeout(() => [a, c].forEach(x => x.classList.add('gone')), 450);
          if (matched === ex.pairs.length) setReady(true);
        } else {
          mistakes++; [a, c].forEach(x => { x.classList.remove('sel'); x.classList.add('bad'); });
          SFX.bad(); setTimeout(() => [a, c].forEach(x => x.classList.remove('bad')), 500);
        }
      }
    });
    SES.check = () => ({ ok: mistakes <= 2, answer: ex.pairs.map(p => p[0] + ' = ' + p[1]).join(' · '), note: mistakes ? `Tuviste ${mistakes} intento${mistakes > 1 ? 's' : ''} fallido${mistakes > 1 ? 's' : ''}.` : '' });
  },
  listen(ex) {
    $('#lbody').innerHTML = fl('Escucha y escribe lo que oyes') + `<div class="q">¿Qué dice?</div>
      <div class="speakers"><button class="spk" id="sp1" aria-label="Escuchar">🔊</button><button class="spk slow" id="sp2" aria-label="Escuchar despacio">🐢</button></div>
      ${canSpeak ? '' : `<p class="muted" style="text-align:center">🔇 Tu navegador no puede reproducir voz. Frase: <b>${esc(ex.en)}</b></p>`}
      <textarea class="field" id="inp" placeholder="Escribe lo que escuchas…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>`;
    const inp = $('#inp');
    $('#sp1').onclick = () => speak(ex.en, 1); $('#sp2').onclick = () => speak(ex.en, .55);
    setTimeout(() => { if (SES && SES.cur === ex && !SES.checked) speak(ex.en, 1); }, 350);
    inp.oninput = () => setReady(inp.value.trim().length > 0);
    inp.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!$('#chk').disabled) onCheck(); } };
    SES.check = () => {
      inp.disabled = true;
      const u = normalize(inp.value), t = normalize(ex.en);
      if (u === t) return { ok: true, answer: ex.en, note: ex.es };
      if (u.length > 5 && lev(u, t) <= 1) return { ok: true, answer: ex.en, note: `Casi perfecto, revisa: "${ex.en}" (${ex.es})` };
      return { ok: false, answer: ex.en, note: ex.es };
    };
  },
  speak(ex) {
    const sttOk = !!SR;
    $('#lbody').innerHTML = fl('Di la frase en voz alta') + `<div class="q">Repite esta frase</div>
      <div class="card" style="text-align:center"><div style="font-size:24px;font-weight:900">${esc(ex.en)}</div><div class="muted">${esc(ex.es || '')}</div>

      ${sttOk ? `<button class="mic" id="mic" aria-label="Hablar">🎤</button><p class="muted" id="heard" style="text-align:center;min-height:36px">Toca el micrófono y habla</p><textarea class="field hidden" id="inp" style="min-height:70px;margin-top:10px" placeholder="Escribe la frase en inglés…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><button class="btn ghost sm" style="display:block;margin:10px auto 0" id="skip2">Omitir ejercicio</button>`
        : `<p class="muted" style="text-align:center">🎙️ Tu navegador no admite reconocimiento de voz. Puedes escribir la frase o saltar este ejercicio.</p>
           <textarea class="field" id="inp" style="min-height:70px" placeholder="Escribe la frase…"></textarea><button class="btn ghost" style="margin-top:12px" id="skip">Omitir ejercicio</button>`}`;
    $('#hear').onclick = () => speak(ex.en, 1);
    if (sttOk) {
      let rec = null;
      const mic = $('#mic'), heard = $('#heard');
      mic.onclick = () => {
        if (SES.checked) return;
        if (rec) { try { rec.stop(); } catch (e) { } return; }
        stopSpeech();
        try {
          rec = new SR(); rec.lang = 'en-US'; rec.maxAlternatives = 3; rec.interimResults = true;
          rec.onstart = () => { mic.classList.add('rec'); heard.textContent = 'Escuchando…'; };
          rec.onresult = e => {
            const r = e.results[e.results.length - 1], alts = [...r].map(a => a.transcript);
            heard.textContent = '“' + alts[0] + '”';
            if (r.isFinal) { SES.ans = alts; setReady(true); }
          };
          rec.onerror = e => {
            const hard = { 'not-allowed': 'Permiso de micrófono denegado.', 'service-not-allowed': 'El navegador bloquea el reconocimiento de voz.', 'network': 'Este navegador (p. ej. Brave) no puede usar el servicio de voz de Google. Prueba en Chrome o Edge, o escribe la frase.', 'audio-capture': 'No se detecta ningún micrófono.', 'language-not-supported': 'Idioma no soportado.' };
            if (hard[e.error]) { heard.textContent = hard[e.error]; const t = $('#inp'); if (t) { t.classList.remove('hidden'); t.oninput = () => { SES.ans = [t.value]; setReady(t.value.trim().length > 0); }; } }
            else heard.textContent = 'No te escuché, inténtalo otra vez.';
          };
          rec.onend = () => { mic.classList.remove('rec'); rec = null; if (!SES.ans) heard.textContent = heard.textContent === 'Escuchando…' ? 'No te escuché, inténtalo otra vez.' : heard.textContent; };
          rec.start();
        } catch (e) { heard.textContent = 'No se pudo iniciar el micrófono.'; rec = null; }
      };
      $('#skip2').onclick = () => { SES.skip = true; SES.ans = ['skip']; setReady(true); onCheck(); };
      SES.check = () => {
        if (SES.skip) return { ok: true, answer: ex.en, skipped: true, note: 'Ejercicio omitido' };
        const best = Math.max(...SES.ans.map(a => simil(a, ex.en)));
        return { ok: best >= 0.72, answer: ex.en, note: best >= 0.72 ? `Pronunciación: ${Math.round(best * 100)}%` : `Escuché: “${SES.ans[0]}”` };
      };
    } else {
      const inp = $('#inp');
      inp.oninput = () => setReady(inp.value.trim().length > 0);
      $('#skip').onclick = () => { SES.skip = true; SES.ans = 'skip'; setReady(true); onCheck(); };
      SES.check = () => {
        if (SES.skip) return { ok: true, answer: ex.en, skipped: true, note: 'Ejercicio omitido' };
        return { ok: simil(inp.value, ex.en) >= 0.9, answer: ex.en };
      };
    }
  }
};

function onCheck() {

  const ex = SES.cur, r = SES.check();
  SES.checked = true;
  const foot = $('#lfoot'), btn = $('#chk');
  if (r.skipped) { SES.skipped++; }
  else {

    else {

function nextEx() {

function finishSession() {
  if (!SES) return;
  const S0 = SES; if (S0.tm) clearInterval(S0.tm); SES = null;
  stopSpeech();
  const secs = Math.max(1, Math.round((Date.now() - S0.t0) / 1000));
  const acc = S0.answered ? Math.round(100 * S0.correct / S0.answered) : 0;
  const perfect = S0.wrong === 0 && S0.answered > 0 && !S0.outOfHearts && S0.mode !== 'timed';
  let xp = 0, gems = 0, title = '¡Lección completada!', sub = '', mood = 'celebrate', passed = null;
  if (S0.outOfHearts) { title = 'Te quedaste sin vidas'; mood = 'sad'; xp = S0.correct * 2; }
  else if (S0.mode === 'lesson') {
    xp = S0.correct * 10 + (perfect ? 20 : 0); gems = perfect ? 10 : 5;
    ST.stats.lessons++; if (perfect) ST.stats.perfect++;
    if (S0.lesson < ST.done[S0.unit]) { xp = Math.round(xp / 2); gems = 0; sub = 'Lección repetida: mitad de XP y sin gemas'; }
    if (S0.lesson === ST.done[S0.unit]) {
      ST.done[S0.unit]++;
      if (ST.done[S0.unit] >= LESSONS_PER_UNIT) sub = `🏅 ¡Unidad ${UNITS[S0.unit].name} completada! Abre tu cofre 🎁` + (S0.unit === 0 ? ' · 📞 ¡Nova te espera!' : '');
    }
  } else if (S0.mode === 'review' || S0.mode === 'practice') {
    xp = S0.correct * 5; gems = 2; title = S0.mode === 'review' ? '¡Repaso completado!' : '¡Práctica completada!';
    ST.stats.lessons++;
  } else if (S0.mode === 'timed') {
    xp = S0.correct * 5; gems = Math.floor(S0.correct / 3); title = '¡Tiempo!'; sub = `⏱️ ${S0.correct} aciertos en el desafío`;
    ST.stats.timedBest = Math.max(ST.stats.timedBest, S0.correct);
  } else if (S0.mode === 'test') {
    passed = acc >= 80;
    if (passed) {
      for (let i = 0; i <= S0.unit; i++) ST.done[i] = LESSONS_PER_UNIT;
      xp = 40; gems = 25; title = '¡Prueba superada!'; sub = `Saltaste hasta la unidad ${UNITS[S0.unit].name} 🚀`;
    } else { title = 'Casi lo logras'; sub = 'Necesitas 80% de precisión para saltar. ¡Inténtalo de nuevo!'; mood = 'sad'; }
  }
  ST.stats.correct += S0.correct; ST.stats.total += S0.answered; ST.stats.seconds += secs;
  ST.gems += gems; addXP(xp); touchStreak(); checkAch(); save();
  SFX[mood === 'sad' ? 'bad' : 'win'](); if (mood !== 'sad') confetti(70);
  $('#overlay').innerHTML = `<div class="lbody result"><div style="width:190px">${fox(mood)}</div><h2 style="font-size:28px">${title}</h2>${sub ? `<p style="font-weight:800">${sub}</p>` : ''}
    <div class="stats3"><div class="st" style="border-color:#ffc83a;color:#d99a00"><small>XP total</small><div>⚡${xp}</div></div>
    <div class="st" style="border-color:#22b573;color:#168a55"><small>Precisión</small><div>🎯${acc}%</div></div>
    <div class="st" style="border-color:#2f8cff;color:#1a63c4"><small>Tiempo</small><div>⏱️${fmtTime(secs)}</div></div></div>
    <p class="muted">${gems ? `+${gems} 💎 · ` : ''}Racha: 🔥 ${curStreak()} día${curStreak() === 1 ? '' : 's'}${perfect ? ' · 💯 ¡Lección perfecta!' : ''}</p>
    <div style="width:100%;margin-top:auto">${S0.outOfHearts && !ST.pro ? '<button class="btn" onclick="setPro(true);closeResult()">Activar PRO (vidas ∞)</button><div style="height:8px"></div>' : ''}<button class="btn green" onclick="closeResult()">Continuar</button></div></div>`;
}

function weekStart(d = new Date()) { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return dayKey(x); }
function weekXP() {
  const ws = new Date(weekStart() + 'T00:00:00'); let s = 0;
  for (let i = 0; i < 7; i++) { const d = new Date(ws); d.setDate(d.getDate() + i); s += ST.xpHist[dayKey(d)] || 0; }
  return s;
}
function viewLeague() {
  const now = new Date(), dow = (now.getDay() + 6) % 7, wk = weekStart();
  const frac = Math.min(1, (dow + now.getHours() / 24 + 0.25) / 7);
  const rows = BOTS.slice(0, 29).map(n => ({ name: n, face: BOT_FACES[hash(n) % BOT_FACES.length], xp: Math.round((60 + hash(wk + n) % 520) * frac) }));
  rows.push({ name: 'Tú', me: true, xp: weekXP() });
  rows.sort((a, b) => b.xp - a.xp || (a.me ? -1 : 1));
  const tier = ST.xp < 500 ? ['Bronce', '🥉'] : ST.xp < 1500 ? ['Plata', '🥈'] : ['Oro', '🥇'];
  let h = `<div class="card" style="text-align:center"><div style="font-size:50px">${tier[1]}</div><h2 style="margin:0">Liga ${tier[0]}</h2><div class="muted">Quedan ${7 - dow} día${7 - dow > 1 ? 's' : ''} · Los 10 mejores suben de liga</div></div><div class="card" style="padding:8px">`;
  rows.forEach((r, i) => {
    if (i === 10) h += `<div class="zone">— ZONA SEGURA —</div>`;
    if (i === 25) h += `<div class="zone down">▼ ZONA DE DESCENSO ▼</div>`;
    if (i === 0) h += `<div class="zone up">▲ ZONA DE ASCENSO ▲</div>`;
    h += `<div class="lrow ${r.me ? 'me' : ''}"><span class="rk">${i + 1}</span><span class="av">${r.me ? '🦊' : r.face}</span><span class="grow">${esc(r.me ? ST.name + ' (tú)' : r.name)}</span><span>${r.xp} XP</span></div>`;
  });
  return h + `</div><p class="muted" style="text-align:center">Clasificación simulada con jugadores bot.</p>`;
}

function importProgress(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result); if (!o || typeof o !== 'object' || typeof o.xp !== 'number') throw new Error('bad');
      const n = merge(defaults(), o); Object.keys(ST).forEach(k => delete ST[k]); Object.assign(ST, n); save(); location.reload();
    } catch (e) { toast('Archivo no válido'); }
  };
  r.readAsText(f);
}
function renameUser() { const n = prompt('¿Cómo te llamas?', ST.name); if (n && n.trim()) { ST.name = n.trim().slice(0, 20); save(); renderAll(); } }
function resetAll() {
  modal(`<h2>¿Borrar todo?</h2><p class="muted">Se perderá tu progreso, racha y XP.</p><button class="btn red" onclick="doReset()">Sí, borrar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button>`);
}
function doReset() { try { localStorage.removeItem(KEY); } catch (e) { } location.reload(); }

/* ================================================================
   Llamadas con Nova
   ================================================================ */
let C = null, CALLSEL = 0;
const STOP = new Set(['the', 'a', 'an', 'is', 'am', 'are', 'to', 'of', 'in', 'my', 'i', 'it', 'you', 'and']);

function openCallModal() {
  if (!needPro('Llamadas con Nova')) return;
  if (!novaUnlocked()) {
    modal(`<div style="text-align:center"><div style="width:120px;margin:auto">${fox('idle')}</div><h2>🔒 Nova aún no contesta</h2><p class="muted">Termina las 3 lecciones de la unidad <b>Saludos</b> para desbloquear las llamadas.</p><button class="btn" onclick="closeModal()">Entendido</button></div>`);
    return;
  }
  const max = currentUnit();
  if (CALLSEL > max) CALLSEL = max;
  CALLSEL = Math.min(Math.max(CALLSEL, 0), max);
  const mode = NOVA_API_KEY ? '🤖 Conversación libre con IA' : (canSpeak && SR) ? '🎙️ Videollamada con voz' : '💬 Modo chat por texto (tu navegador no soporta voz completa)';
  modal(`<div style="text-align:center"><div style="width:130px;height:150px;margin:auto">${novaSVG('smirk').replace('id="novaSvg"', '')}</div><h2>Llamar a Nova <span class="pro">PRO</span></h2>
    <p class="muted">Tema de la conversación (según tus unidades):</p>
    <div>${TOPICS.filter(t => t.unit <= max).map(t => `<button class="pill ${TOPICS.indexOf(t) === CALLSEL ? 'sel' : ''}" onclick="CALLSEL=${TOPICS.indexOf(t)};openCallModal()">${t.emoji} ${t.title}</button>`).join('')}</div>
    <p class="muted" style="margin-top:10px">${mode}</p>
    <button class="btn green" onclick="startCall(${CALLSEL})">📞 Llamar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`);
}

function buildCall() {
  const ov = $('#callov');
  const dots = Array.from({ length: 7 }, (_, i) => `<i style="width:${60 + i * 28}px;height:${60 + i * 28}px;left:${(i * 37) % 90}%;top:${(i * 23) % 70}%"></i>`).join('');
  ov.innerHTML = `<div class="room">${dots}</div>
    <div class="ctop"><span class="rec-dot"></span><span class="nm">Nova</span><span class="tm" id="callTimer">00:00</span></div>
    <div class="nova-wrap">${novaSVG('neutral')}</div>
    <div class="pip">${fox('idle')}<span>${esc(ST.name)}</span></div>
    <div class="chatlog ${C.chat ? '' : 'hidden'}" id="chatlog"></div>
    <div class="subs" id="subs"></div>
    <div class="hintbox hidden" id="hintbox"></div>
    <div class="cctl">
      <form class="ctext ${C.vIn ? 'hidden' : ''}" id="cform"><input id="cinp" autocomplete="off" placeholder="Escribe tu respuesta en inglés…"><button type="submit">Enviar</button></form>
      <div class="cbtns">
        <button class="cb ${C.subs ? 'on' : ''}" id="ccBtn" onclick="toggleCC()" aria-label="Subtítulos">CC</button>
        <button class="cb" id="micBtn" onclick="toggleMic()" aria-label="Micrófono">🎤</button>
        <button class="cb" id="kbBtn" onclick="toggleKb()" aria-label="Teclado">⌨️</button>
        <button class="cb hang" onclick="endCall(false)" aria-label="Colgar">📞</button>
      </div>
    </div>
    <div class="ringing" id="ringing"><div class="ava">${novaSVG('smirk').replace('id="novaSvg"', '')}</div>Llamando a Nova…<span class="muted" style="color:#ddd">Conectando</span></div>`;
  ov.classList.add('show'); pushOv();
  $('#cform').onsubmit = e => { e.preventDefault(); const i = $('#cinp'); const v = i.value.trim(); i.value = ''; if (!v || !C) return; if (C.waiting) handleAnswer(v); else { C.queued = v; chatAdd('u', v); } };
  updMic();
}

function startCall(ti) {
  closeModal();
  stopSpeech();
  const t = TOPICS[ti];
  C = { t, ti, turn: 0, retries: 0, phrases: [], weakW: [], first: 0, later: 0, gaveUp: 0, xp: 0, t0: 0, ended: false, connected: false,
    micOn: true, waiting: false, listening: false, lid: 0, rec: null, silence: null, subs: ST.subs, vOut: canSpeak, vIn: !!SR,
    chat: !(canSpeak && SR), llm: !!NOVA_API_KEY, llmFailed: false, hist: [], exch: 0, tmr: null, sayId: 0, lastN: '', lastU: '' };
  buildCall(); SFX.ring();
  setTimeout(async () => {
    if (!C || C.ended) return;
    $('#ringing').remove(); C.connected = true; C.t0 = Date.now();
    C.tmr = setInterval(() => { const e = $('#callTimer'); if (e) e.textContent = fmtTime(Math.round((Date.now() - C.t0) / 1000)); }, 500);
    if (C.llm) {
      await novaSay(t.intro + ' So, tell me about yourself!', { expr: 'surprised' });
      if (!C || C.ended) return;
      C.waiting = true; startListening();
    } else {
      await novaSay(t.intro, { expr: 'surprised' });
      await askTurn();
    }
  }, 2600);
}

function setExpr(e) { const s = $('#novaSvg'); if (s) s.dataset.expr = e; }
function talk(on) { const s = $('#novaSvg'); if (s) s.classList.toggle('talk', on); }
function renderSubs() {
  const s = $('#subs'); if (!s) return;
  s.innerHTML = (C.subs && !C.chat) ? (C.lastN ? `<span>${esc(C.lastN)}</span>` : '') + (C.lastU ? `<span class="me">Tú: ${esc(C.lastU)}</span>` : '') : '';
}
function chatAdd(who, text) {
  const l = $('#chatlog'); if (!l || !C.chat) return;
  const d = document.createElement('div'); d.className = 'msg ' + who; d.textContent = text; l.appendChild(d); l.scrollTop = l.scrollHeight;
}
function updMic() {
  const b = $('#micBtn'); if (!b || !C) return;
  b.classList.toggle('listening', !!C.listening);
  b.classList.toggle('on', !C.micOn && C.vIn);
  b.textContent = (!C.vIn || !C.micOn) ? '🔇' : '🎤';
}
function toggleCC() { if (!C) return; C.subs = !C.subs; ST.subs = C.subs; save(); $('#ccBtn').classList.toggle('on', C.subs); renderSubs(); }
function toggleKb() { const f = $('#cform'); f.classList.toggle('hidden'); if (!f.classList.contains('hidden')) $('#cinp').focus(); }
function toggleMic() {
  if (!C) return;
  if (!C.vIn) { toast('Tu navegador no soporta reconocimiento de voz: usa el teclado'); return; }
  C.micOn = !C.micOn;
  if (!C.micOn) { stopRec(); C.listening = false; }
  else if (C.waiting) startListening();
  updMic();
}

async function novaSay(text, o = {}) {
  if (!C || C.ended) return;
  const id = ++C.sayId;
  setExpr(o.expr || 'neutral'); talk(true);
  C.lastN = text; renderSubs(); chatAdd('n', text);
  if (C.vOut) await speak(text, o.rate || 1, 1.18);
  else await sleep(Math.min(4500, 600 + text.length * 40));
  if (C && id === C.sayId) talk(false);
}
async function askTurn() {
  if (!C || C.ended) return;
  const turn = C.t.turns[C.turn];
  await novaSay(turn.n, { expr: 'neutral' });
  if (!C || C.ended) return;
  C.lastU = ''; renderSubs();
  C.waiting = true; startListening();
}
function stopRec() { if (C && C.rec) { try { C.rec.onend = null; C.rec.abort(); } catch (e) { } C.rec = null; } }
function clearSilence() { if (C && C.silence) { clearTimeout(C.silence); C.silence = null; } }
function startListening() {
  if (!C || C.ended || !C.waiting) return;
  if (C.queued) { const q = C.queued; C.queued = null; setTimeout(() => handleAnswer(q), 0); return; }
  clearSilence();
  C.silence = setTimeout(noAnswer, C.vIn && C.micOn ? 11000 : 30000);
  if (!C.vIn || !C.micOn) { const i = $('#cinp'); if (i && !$('#cform').classList.contains('hidden')) i.focus(); return; }
  stopRec();
  const id = ++C.lid; let got = false;
  try {
    const r = new SR(); C.rec = r;
    r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
    r.onstart = () => { C.listening = true; updMic(); };
    r.onresult = e => {
      const res = e.results[e.results.length - 1], alts = [...res].map(a => a.transcript);
      C.lastU = alts[0]; renderSubs();
      if (res.isFinal && id === C.lid) { got = true; handleAnswer(alts); }
    };
    r.onerror = e => {
      if (['not-allowed', 'service-not-allowed', 'network', 'audio-capture', 'language-not-supported'].includes(e.error)) {
        C.vIn = false; C.chat = true; C.micOn = false; $('#cform').classList.remove('hidden'); $('#chatlog').classList.remove('hidden'); updMic();
        toast(e.error === 'network' ? 'Este navegador no ofrece reconocimiento de voz: responde escribiendo' : 'Micrófono no disponible: responde escribiendo');
      }
    };
    r.onend = () => { C.listening = false; updMic(); if (!got && id === C.lid && C.waiting && !C.ended && C.vIn && C.micOn) setTimeout(() => { if (C.waiting && id === C.lid) startListening(); }, 300); };
    r.start();
  } catch (e) { C.vIn = false; $('#cform').classList.remove('hidden'); }
}
function noAnswer() { if (!C || C.ended || !C.waiting) return; C.waiting = false; clearSilence(); stopRec(); C.listening = false; updMic(); failFlow(''); }

function hintPhrase(turn) {
  const m = /"([^"]+)"/.exec(turn.h || ''); if (!m) return '';
  return m[1].replace(/[…]/g, '').replace(/\([^)]*\)/g, '').trim();
}
function showHint(txt) { const h = $('#hintbox'); if (!h) return; h.textContent = '💡 ' + txt; h.classList.remove('hidden'); }
function hideHint() { const h = $('#hintbox'); if (h) h.classList.add('hidden'); }

async function handleAnswer(alts) {
  if (!C || C.ended || !C.waiting) return;
  C.waiting = false; clearSilence(); stopRec(); C.listening = false; updMic();
  alts = [].concat(alts); const text = String(alts[0] || '').trim();
  if (!text) { C.waiting = true; startListening(); return; }
  C.lastU = text; renderSubs(); chatAdd('u', text);
  if (C.llm && !C.llmFailed) return llmReply(text);
  const turn = C.t.turns[C.turn];
  const hit = alts.find(a => matchTurn(a, turn));
  if (hit !== undefined) {
    const first = C.retries === 0;
    first ? C.first++ : C.later++;
    C.phrases.push(cap(hit)); C.xp += first ? 15 : 8; C.retries = 0; C.turn++; hideHint();
    SFX.ok();
    if (C.turn >= C.t.turns.length) { await novaSay(turn.c + ' ' + C.t.outro, { expr: 'happy' }); return endCall(true); }
    await novaSay(turn.c, { expr: 'smirk' });
    return askTurn();
  }
  C.lastText = text;
  failFlow(text);
}
async function failFlow(text) {
  if (!C || C.ended) return;
  const turn = C.t.turns[C.turn];
  C.retries++;
  if (C.retries === 1) {
    await novaSay(text ? "Hmm, not quite. Let me say it slowly." : "Hello? Did you fall asleep? I'll say it slowly.", { expr: 'think' });
    await novaSay(turn.n, { rate: .6, expr: 'neutral' });
  } else if (C.retries === 2) {
    showHint(turn.h);
    const ph = hintPhrase(turn);
    await novaSay("Okay, here's a hint." + (ph ? ' Try saying: ' + ph : ''), { rate: .7, expr: 'smirk' });
  } else {
    const said = normalize(text).split(' ');
    hintPhrase(turn).split(/\s+/).map(w => normalize(w)).filter(w => w.length > 2 && !STOP.has(w) && !said.includes(w)).forEach(w => { if (!C.weakW.includes(w)) C.weakW.push(w); });
    C.gaveUp++; C.retries = 0; C.turn++; hideHint();
    if (C.turn >= C.t.turns.length) { await novaSay("Okay, that's enough. We'll practice that later. " + C.t.outro, { expr: 'happy' }); return endCall(true); }
    await novaSay("No worries, we'll practice that later. Next question!", { expr: 'happy' });
    return askTurn();
  }
  if (!C || C.ended) return;
  C.waiting = true; startListening();
}

async function llmReply(text) {
  C.exch++; C.phrases.push(cap(text)); C.first++; C.xp += 12;
  C.hist.push({ role: 'user', content: text });
  const sys = `You are Nova, a friendly but sarcastic young woman with purple hair, on a video call helping a Spanish speaker practice beginner English (A1-A2). Topic: ${C.t.title}. Reply in at most two short, simple sentences in English, with light teasing but kind. If the learner made a grammar mistake, correct it briefly. End with a simple question.`;
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': NOVA_API_KEY, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: NOVA_MODEL, max_tokens: 200, system: sys, messages: C.hist }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(), reply = (j.content && j.content[0] && j.content[0].text) || 'Interesting. Go on.';
    C.hist.push({ role: 'assistant', content: reply });
    await novaSay(reply, { expr: 'smirk' });
    if (!C || C.ended) return;
    if (C.exch >= 10) { await novaSay('Okay, enough chatting for today. Bye!', { expr: 'happy' }); return endCall(true); }
    C.waiting = true; startListening();
  } catch (e) {
    C.llmFailed = true; C.exch = 0; C.phrases = []; C.first = 0; C.xp = 0;
    toast('IA no disponible: sigo con el guion');
    await askTurn();
  }
}

function endCall(done) {
  if (!C || C.ended) return;
  const c = C; c.ended = true; c.waiting = false; stopRec(); clearSilence(); clearInterval(c.tmr);
  stopSpeech();
  if (!c.connected) { $('#callov').classList.remove('show'); return; }
  SFX.hang();
  const secs = Math.round((Date.now() - c.t0) / 1000);
  const attempted = c.first + c.later + c.gaveUp;
  const fluency = c.llm && !c.llmFailed ? Math.min(100, 50 + c.exch * 5) : attempted ? Math.round(100 * (c.first + .6 * c.later) / attempted) : 0;
  const xp = c.xp + (done ? 20 : 0);
  c.weakW.forEach(w => { ST.words[w] = (ST.words[w] || 0) + 1; });
  if (attempted > 0 || secs > 30) { ST.stats.calls++; }
  ST.stats.callSec += secs;
  addXP(xp); touchStreak(); checkAch(); save();
  if (done) { SFX.win(); confetti(50); }
  const label = fluency >= 85 ? 'Excelente 🌟' : fluency >= 60 ? 'Bien 👍' : attempted ? 'A practicar 💪' : 'Sin datos';
  const ov = $('#callov');
  ov.innerHTML = `<div class="room"></div><div class="lbody" style="position:relative;z-index:2;color:#fff;text-align:center;align-items:center">
    <div style="height:150px;margin-top:10px">${novaSVG(fluency >= 60 ? 'happy' : 'smirk').replace('id="novaSvg"', '').replace('<svg', '<svg style="height:150px"')}</div>
    <h2>Llamada terminada</h2>
    <div class="stats3"><div class="st" style="border-color:#ffc83a;color:#ffc83a"><small>XP</small><div style="color:#2b2140">⚡${xp}</div></div>
      <div class="st" style="border-color:#9be7ff;color:#9be7ff"><small>Duración</small><div style="color:#2b2140">⏱️${fmtTime(secs)}</div></div>
      <div class="st" style="border-color:#86efac;color:#86efac"><small>Fluidez</small><div style="color:#2b2140">${fluency}</div></div></div>
    <p style="font-weight:900;margin:0 0 8px">Fluidez: ${label}</p>
    <div style="width:100%;text-align:left"><b>✅ Frases dichas correctamente</b>
      ${c.phrases.length ? c.phrases.map(p => `<div class="msg n" style="margin-top:6px;max-width:100%">${esc(p)}</div>`).join('') : '<p style="opacity:.7">Aún no dijiste frases completas.</p>'}
      <b style="display:block;margin-top:14px">⚠️ Palabras a mejorar</b>
      <div style="margin-top:6px">${c.weakW.length ? c.weakW.map(w => `<span class="pill" style="background:#fff3c4;color:#5a4300">${esc(w)}</span>`).join('') + '<p style="opacity:.8;font-size:13px">Se agregaron a tu Repaso de errores.</p>' : '<p style="opacity:.7">¡Ninguna! Muy bien.</p>'}</div></div>
    <div style="width:100%;margin-top:auto;padding-top:16px"><button class="btn green" onclick="closeCall()">Volver</button><button class="btn ghost" style="margin-top:12px" onclick="closeCall();openCallModal()">Llamar otra vez</button></div></div>`;
}
function closeCall() { $('#callov').classList.remove('show'); C = null; renderAll(); }

/* ----------------------- PWA: instalación y service worker ----------------------- */
let installEvt = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (TAB === 'profile') renderView(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('✅ LinguaPop instalada'); if (TAB === 'profile') renderView(); });
async function installApp() {
  if (!installEvt) { modal(`<h2>📲 Instalar LinguaPop</h2><p class="muted">En Chrome/Edge: menú ⋮ → "Instalar app". En iPhone (Safari): botón Compartir → "Añadir a pantalla de inicio".</p><button class="btn" onclick="closeModal()">Entendido</button>`); return; }
  installEvt.prompt(); try { await installEvt.userChoice; } catch (e) { } installEvt = null; renderView();
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { /* sin soporte offline */ }));
}

/* ----------------------- Inicio ----------------------- */
(function init() {
  if (ST.heartsDay !== dayKey()) { ST.hearts = 5; ST.heartsDay = dayKey(); }
  if (ST.theme === 'auto' && window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); renderTop(); }); } catch (e) { } }
  applyTheme(); checkAch(); save(); renderAll();
  document.addEventListener('visibilitychange', () => { if (document.hidden && hasTTS) { /* pausa de voz al salir */ } });
})();
</script>
