name: Migraciones

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migraciones.yml'
  workflow_dispatch:
    inputs:
      entorno:
        description: 'Entorno al que aplicar las migraciones'
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: migraciones-${{ github.event.inputs.entorno || 'staging' }}
  cancel-in-progress: false

jobs:
  # Staging se actualiza solo con cada cambio de migraciones en main.
  # Producción solo se aplica a mano, desde "Run workflow" (y con la aprobación
  # que se configure en el entorno "production").
  aplicar:
    name: aplicar-${{ github.event.inputs.entorno || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.entorno || 'staging' }}
    steps:
      - name: Comprobar credenciales de Supabase
        id: credenciales
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Faltan SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD o la variable SUPABASE_PROJECT_REF en este entorno: no se aplican migraciones."
            echo "listas=false" >> "$GITHUB_OUTPUT"
          else
            echo "listas=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.credenciales.outputs.listas == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.credenciales.outputs.listas == 'true'
      - uses: actions/setup-node@v7
        if: steps.credenciales.outputs.listas == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.credenciales.outputs.listas == 'true'

      # Las credenciales solo se exponen a los pasos que hablan con Supabase.
      - name: Vincular el proyecto
        if: steps.credenciales.outputs.listas == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: pnpm supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Aplicar las migraciones
        if: steps.credenciales.outputs.listas == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm supabase db push
