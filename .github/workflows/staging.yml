name: Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar credenciales de Cloudflare
        id: credenciales
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID: no se despliega."
            echo "listas=false" >> "$GITHUB_OUTPUT"
          else
            echo "listas=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.credenciales.outputs.listas == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.credenciales.outputs.listas == 'true'
      - uses: actions/setup-node@v7
        if: steps.credenciales.outputs.listas == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.credenciales.outputs.listas == 'true'
      # La URL y la clave anónima de Supabase son públicas (AD-9); si faltan, la app sale sin cuentas.
      - run: pnpm --filter @linguapop/app build
        if: steps.credenciales.outputs.listas == 'true'
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Armar el sitio (app nueva y versión heredada)
        if: steps.credenciales.outputs.listas == 'true'
        run: |
          mkdir site
          cp -r apps/app/dist/. site/
          cp -r legacy site/legacy
          printf '/legacy /legacy/linguapop.html 302\n/legacy/ /legacy/linguapop.html 302\n' > site/_redirects

      # Las credenciales solo se exponen a los pasos que hablan con Cloudflare.
      - name: Comprobar el acceso a Cloudflare Pages
        id: pages
        if: steps.credenciales.outputs.listas == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          respuesta=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
          if [ "$(echo "$respuesta" | jq -r '.success // false')" != "true" ]; then
            motivo=$(echo "$respuesta" | jq -r '[.errors[]?.message] | join("; ")')
            echo "::error::Cloudflare rechazó el acceso a Pages (${motivo:-sin detalle}). El token necesita el permiso Cuenta > Cloudflare Pages > Editar sobre esta cuenta, y CLOUDFLARE_ACCOUNT_ID debe ser el de esa cuenta."
            exit 1
          fi
          if echo "$respuesta" | jq -e '.result[]? | select(.name == "linguapop-staging")' > /dev/null; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear el proyecto de Pages
        if: steps.pages.outputs.existe == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.152.0 pages project create linguapop-staging --production-branch main

      - name: Publicar la web de staging
        if: steps.credenciales.outputs.listas == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.152.0 pages deploy site --project-name linguapop-staging --branch main
