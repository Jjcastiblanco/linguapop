name: Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/desplegar-web.yml
    with:
      entorno: staging
      proyecto: linguapop-staging
    secrets: inherit
